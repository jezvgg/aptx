[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aptx"
version = "0.1.0"
description = "Run Debian packages without installing them: live paths, zero traces, one command to clean up"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jezv" }]
keywords = ["debian", "apt", "sandbox", "bubblewrap", "portable"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Software Distribution",
]
dependencies = ["click>=8.1", "rich>=13"]

[project.scripts]
aptx = "aptx.cli:main"

[dependency-groups]
dev = ["pytest>=8", "coverage>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/aptx"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: needs network, apt and a sandbox backend"]
addopts = "-q"

[tool.coverage.run]
source = ["src/aptx"]

[tool.coverage.report]
skip_covered = false
fail_under = 100
show_missing = true

[tool.mypy]
mypy_path = "src"
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
